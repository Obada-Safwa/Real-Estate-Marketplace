<!-- Delete Confirmation Modal -->
<div
  class="modal fade"
  id="deletePropertyModal"
  tabindex="-1"
  aria-labelledby="deletePropertyModalLabel"
  aria-hidden="true"
>
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header bg-danger text-white">
        <h5 class="modal-title" id="deletePropertyModalLabel">
          <i class="fas fa-exclamation-triangle me-2"></i>Confirm Delete
        </h5>
        <button
          type="button"
          class="btn-close btn-close-white"
          data-bs-dismiss="modal"
          aria-label="Close"
        ></button>
      </div>
      <div class="modal-body">
        <p class="mb-0">
          Are you sure you want to delete this property? This action cannot be
          undone.
        </p>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
          Cancel
        </button>
        <button type="button" class="btn btn-danger" id="confirmDeleteBtn">
          <i class="fas fa-trash me-2"></i>Delete Property
        </button>
      </div>
    </div>
  </div>
</div>

<script>
  getProperties();
  getPropertiesWithReport();
  setTimeout(function () {
    const confirmDeleteBtn = document.getElementById("confirmDeleteBtn");
    if (confirmDeleteBtn) {
      confirmDeleteBtn.addEventListener("click", confirmDeleteProperty);
    } else {
      console.error("confirmDeleteBtn element not found!");
    }
  }, 100);
</script>
