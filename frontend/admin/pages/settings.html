<!-- Reports Page -->
<div class="reports-container">
  <div class="row mb-4">
    <div class="col-12">
      <div class="card dashboard-card">
        <div class="card-header-with-actions">
          <h5 class="card-title mb-0">Reports</h5>
        </div>
        <div class="card-body">
          <!-- Reports Table -->
          <div class="table-container">
            <div class="table-responsive">
              <table class="table table-hover admin-table">
                <thead>
                  <tr>
                    <th>ID</th>
                    <th>User ID</th>
                    <th>Property ID</th>
                    <th>Reason</th>
                    <th>Status</th>
                    <th>Delete Report</th>
                  </tr>
                </thead>
                <tbody id="reportsTableBody">
                  <!-- Table content will be loaded dynamically -->
                </tbody>
              </table>
            </div>
          </div>

          <style>
            /* Timeline styles for user activity */
            .timeline-container {
              position: relative;
              padding-left: 30px;
            }

            .timeline-container::before {
              content: "";
              position: absolute;
              top: 0;
              bottom: 0;
              left: 15px;
              width: 2px;
              background-color: #e9ecef;
            }

            .timeline-item {
              position: relative;
              margin-bottom: 20px;
            }

            .timeline-marker {
              position: absolute;
              left: -30px;
              width: 15px;
              height: 15px;
              border-radius: 50%;
              top: 5px;
            }

            .timeline-content {
              padding-bottom: 10px;
            }
          </style>
        </div>
      </div>
    </div>
  </div>
</div>
<script src="assets/js/reports.js"></script>
<script>
  getReports();
</script>
