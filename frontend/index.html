<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Real Estate Marketplace</title>
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <meta content="" name="keywords" />
    <meta content="" name="description" />

    <!-- Google Web Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&family=Playfair+Display:wght@600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Icon Font Stylesheet -->
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.10.0/css/all.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.4.1/font/bootstrap-icons.css"
      rel="stylesheet"
    />

    <!-- Customized Bootstrap Stylesheet -->
    <link href="assets/css/bootstrap.min.css" rel="stylesheet" />

    <!-- Template Stylesheet -->
    <link href="assets/css/style.css" rel="stylesheet" />
    <link href="assets/css/bonus.css" rel="stylesheet" />

    <link rel="stylesheet" href="assets/css/jQuerySPApp.css" />
  </head>

  <body>
    <!-- Spinner Start -->
    <div
      id="spinner"
      class="show bg-white position-fixed translate-middle w-100 vh-100 top-50 start-50 d-flex align-items-center justify-content-center"
    >
      <div class="spinner-grow text-primary" role="status"></div>
    </div>
    <!-- Spinner End -->

    <!-- Navbar Start -->
    <nav
      class="navbar navbar-expand-lg navbar-dark py-lg-0 px-lg-5 wow fadeIn fixed-nav bg-dark"
      data-wow-delay="0.1s"
    >
      <a href="#main" class="navbar-brand ms-4 ms-lg-0">
        <h1 class="text-primary m-0">RealAgency</h1>
      </a>
      <button
        type="button"
        class="navbar-toggler me-4"
        data-bs-toggle="collapse"
        data-bs-target="#navbarCollapse"
      >
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarCollapse">
        <div class="navbar-nav mx-auto px-5 p-lg-0">
          <a href="#main" class="nav-item nav-link active">Projects</a>
          <a href="#properties" class="nav-item nav-link">Properties</a>
          <a href="#about" class="nav-item nav-link">About</a>
          <a href="#service" class="nav-item nav-link">Services</a>
        </div>
        <div class="mx-auto p-2 p-lg-0 d-flex">
          <button class="add-property-btn me-2">
            <span>
              <svg
                height="24"
                width="24"
                viewBox="0 0 24 24"
                xmlns="http://www.w3.org/2000/svg"
              >
                <path d="M0 0h24v24H0z" fill="none"></path>
                <path
                  d="M11 11V5h2v6h6v2h-6v6h-2v-6H5v-2z"
                  fill="currentColor"
                ></path>
              </svg>
              Add Property
            </span>
          </button>
          <button class="logout-btn" id="logout-btn">
            <span>
              <svg
                height="24"
                width="24"
                viewBox="0 0 24 24"
                xmlns="http://www.w3.org/2000/svg"
              >
                <path d="M0 0h24v24H0z" fill="none"></path>
                <path
                  d="M17 7l-1.41 1.41L18.17 11H8v2h10.17l-2.58 2.58L17 17l5-5zM4 5h8V3H4c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h8v-2H4V5z"
                  fill="currentColor"
                ></path>
              </svg>
              Logout
            </span>
          </button>
        </div>
      </div>
    </nav>
    <!-- Navbar End -->
    <main id="spapp" role="main">
      <section id="about" data-load="about.html"></section>
      <section id="main"></section>
      <section id="properties"></section>
      <section id="service" data-load="service.html"></section>
      <section id="propertydetails" data-load="propertydetails.html"></section>
    </main>

    <!-- Footer Start -->
    <div
      class="container-fluid bg-dark text-light footer mb-0 py-3"
      data-wow-delay="0.1s"
    >
      <div class="container py-5">
        <div class="row footer-bonus">
          <div class="col-lg-3 col-md-6">
            <h4 class="text-light mb-4">Office Address</h4>
            <p class="mb-2">
              <i class="fa fa-map-marker-alt me-3"></i>123 Street, New York, USA
            </p>
            <p class="mb-2">
              <i class="fa fa-phone-alt me-3"></i>+012 345 67890
            </p>
            <p class="mb-2">
              <i class="fa fa-envelope me-3"></i>info@example.com
            </p>
            <div class="d-flex pt-2">
              <a
                class="btn btn-square btn-outline-light rounded-circle me-1"
                href=""
                ><i class="fab fa-twitter"></i
              ></a>
              <a
                class="btn btn-square btn-outline-light rounded-circle me-1"
                href=""
                ><i class="fab fa-facebook-f"></i
              ></a>
              <a
                class="btn btn-square btn-outline-light rounded-circle me-1"
                href=""
                ><i class="fab fa-youtube"></i
              ></a>
              <a
                class="btn btn-square btn-outline-light rounded-circle me-0"
                href=""
                ><i class="fab fa-linkedin-in"></i
              ></a>
            </div>
          </div>
          <div class="col-lg-3 col-md-6">
            <h4 class="text-light mb-4">Quick Links</h4>
            <a class="btn btn-link" href="#about">About Us</a>
            <a class="btn btn-link" href="#contact">Contact Us</a>
            <a class="btn btn-link" href="#">Our Services</a>
            <a class="btn btn-link" href="#">Terms & Condition</a>
            <a class="btn btn-link" href="#">Support</a>
          </div>
        </div>
      </div>
    </div>
    <!-- Footer End -->

    <!-- Toastr CSS -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/toastr.js/latest/toastr.min.css"
    />

    <!-- JavaScript Libraries -->
    <script src="https://code.jquery.com/jquery-3.4.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jquery-validation@1.19.3/dist/jquery.validate.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/toastr.js/latest/toastr.min.js"></script>

    <!-- Add Property Modal -->
    <div
      class="modal fade"
      id="addPropertyModal"
      tabindex="-1"
      aria-labelledby="addPropertyModalLabel"
      aria-hidden="true"
    >
      <div class="modal-dialog modal-lg">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="addPropertyModalLabel">
              Add New Property
            </h5>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
              aria-label="Close"
            ></button>
          </div>
          <div class="modal-body">
            <form id="addPropertyForm" enctype="multipart/form-data">
              <div class="row g-3">
                <div class="col-md-6">
                  <div class="form-group mb-3">
                    <label class="form-label">Title *</label>
                    <input
                      type="text"
                      class="form-control"
                      name="title"
                      required
                    />
                  </div>
                  <div class="form-group mb-3">
                    <label class="form-label">Description</label>
                    <textarea
                      class="form-control"
                      name="description"
                      rows="3"
                    ></textarea>
                  </div>
                  <div class="form-group mb-3">
                    <label class="form-label">Price *</label>
                    <div class="input-group">
                      <span class="input-group-text">$</span>
                      <input
                        type="number"
                        class="form-control"
                        name="price"
                        required
                      />
                    </div>
                  </div>
                  <div class="form-group mb-3">
                    <label class="form-label">Type *</label>
                    <select class="form-select" name="type" required>
                      <option value="">Select Type</option>
                      <option value="rent">For Rent</option>
                      <option value="sale">For Sale</option>
                    </select>
                  </div>
                </div>
                <div class="col-md-6">
                  <div class="form-group mb-3">
                    <label class="form-label">Bedrooms *</label>
                    <input
                      type="number"
                      class="form-control"
                      name="bedrooms"
                      required
                    />
                  </div>
                  <div class="form-group mb-3">
                    <label class="form-label">Bathrooms *</label>
                    <input
                      type="number"
                      class="form-control"
                      name="bathrooms"
                      required
                      step="0.5"
                    />
                  </div>
                  <div class="form-group mb-3">
                    <label class="form-label">Area (sq ft) *</label>
                    <div class="input-group">
                      <input
                        type="number"
                        class="form-control"
                        name="area"
                        step="0.01"
                        required
                      />
                      <span class="input-group-text">sq ft</span>
                    </div>
                  </div>
                  <div class="form-group mb-3">
                    <label class="form-label">Category *</label>
                    <select class="form-select" name="category" required>
                      <option value="">Select Category</option>
                      <option value="apartment">Apartment</option>
                      <option value="house">House</option>
                      <option value="commercial">Commercial</option>
                      <option value="land">Land</option>
                    </select>
                  </div>
                </div>
                <div class="col-12">
                  <div class="form-group mb-3">
                    <label class="form-label">Location *</label>
                    <input
                      type="text"
                      class="form-control"
                      name="location"
                      required
                    />
                  </div>
                </div>
                <div class="col-12">
                  <div class="form-group mb-3">
                    <label class="form-label">Property Images *</label>
                    <input
                      type="file"
                      class="form-control"
                      name="images"
                      multiple
                      accept="image/*"
                      required
                    />
                    <div class="form-text">You can select multiple images</div>
                  </div>
                </div>
              </div>
              <div class="modal-footer">
                <button
                  type="button"
                  class="btn btn-secondary"
                  data-bs-dismiss="modal"
                >
                  Cancel
                </button>
                <button
                  type="submit"
                  class="btn btn-primary"
                  id="submitPropertyBtn"
                >
                  Add Property
                </button>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>

    <!-- Template Javascript -->
    <script src="assets/js/spinner.js"></script>
    <script src="assets/js/jquery.spapp.min.js"></script>
    <script src="assets/js/custom.js"></script>
    <script src="utils/constants.js"></script>
    <script src="utils/rest_client.js"></script>
    <script src="utils/utils.js"></script>
    <script src="utils/form_validation.js"></script>
    <script src="services/properties_services.js"></script>
  </body>
</html>
<script>
  toastr.options = {
    closeButton: true,
    progressBar: true,
    positionClass: "toast-top-right",
    timeOut: 5000,
    extendedTimeOut: 1000,
    showEasing: "swing",
    hideEasing: "linear",
    showMethod: "fadeIn",
    hideMethod: "fadeOut",
  };

  document.addEventListener("DOMContentLoaded", function () {
    if (!Utils.get_from_localstorage("user")) {
      console.log("user not found");
      window.location.reload();
      window.location.href = "pages/login.html";
    }

    // Initialize Add Property modal
    const addPropertyModal = new bootstrap.Modal(
      document.getElementById("addPropertyModal")
    );

    // Open modal when Add Property button is clicked
    document
      .querySelector(".add-property-btn")
      .addEventListener("click", function () {
        addPropertyModal.show();
      });
  });

  $(document).ready(function () {
    FormValidation.validate(
      "#addPropertyForm",
      {
        title: {
          required: true,
          minlength: 5,
          maxlength: 100,
        },
        description: {
          required: true,
          minlength: 10,
          maxlength: 1000,
        },
        price: {
          required: true,
          min: 1,
          number: true,
        },
        type: {
          required: true,
        },
        bedrooms: {
          required: true,
          min: 0,
          number: true,
        },
        bathrooms: {
          required: true,
          min: 0.5,
          number: true,
        },
        area: {
          required: true,
          min: 1,
          number: true,
        },
        category: {
          required: true,
        },
        location: {
          required: true,
          minlength: 3,
          maxlength: 200,
        },
        images: {
          required: true,
        },
      },
      function (data) {
        console.log("data", data);
        RestClient.post(
          "properties",
          data,
          function (response) {
            toastr.success("Property Added");
            console.log("Property Added", response);
          },
          function (error) {
            console.log("error Add Property", error);

            toastr.error(error.responseText || "There is an Error");
          }
        );
      }
    );
    console.log("Document is ready!");
    console.log(document.getElementById("addPropertyForm"));
  });

  // Logout button functionality
  document.getElementById("logout-btn").addEventListener("click", function () {
    // Clear user data from localStorage
    localStorage.removeItem("user");
    // Redirect to login page
    window.location.href = "pages/login.html";
    window.location.reload();
  });

  // Show/hide logout button based on login status
  document.addEventListener("DOMContentLoaded", function () {
    const logoutBtn = document.getElementById("logout-btn");
    if (localStorage.getItem("user")) {
      logoutBtn.style.display = "block";
    } else {
      logoutBtn.style.display = "none";
    }
  });
</script>
